name: Extract Laravel Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o Glow-Basket-BD-Professional-Laravel.zip -d .
          rm Glow-Basket-BD-Professional-Laravel.zip

      - name: Save Laravel files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Laravel project files" || echo "No changes"
          git push
